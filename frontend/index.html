<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Minimal Chatbot</h1>
            <div class="version">v2.0 - Server API Integration</div>
        </header>
        
        <div class="api-settings">
            <div class="api-key-container">
                <input type="password" id="api-key-input" placeholder="Enter your Astra API key" autocomplete="off">
                <button id="save-api-key" title="Save API Key">Save</button>
                <div class="api-status" id="api-status">API Key: <span id="api-status-value">Not Set</span></div>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here dynamically -->
            <div class="message bot">
                <div class="message-content">
                    Hello! Please enter your DataStax Astra API key to start chatting. Your key will be stored only in your browser.
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off" value="What is the document about?" disabled>
                <button type="submit" id="send-button" disabled>
                    <span>Send</span>
                </button>
            </form>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
