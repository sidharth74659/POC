# deploy/docker-compose.yml

version: '3.8'

services:
  backend:
    build: ../backend
    container_name: backend
    restart: always
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build: ../frontend
    container_name: frontend
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
