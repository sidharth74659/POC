
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Asset Management System - SQL-Only</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Inventory Asset Management System</h1>
            <p>SQL-Only Implementation - Frontend Database with Function Middleware</p>
        </div>

        <div class="main-content">
            <!-- Query Interface Panel -->
            <div class="panel">
                <h2>Function Interface</h2>
                
                <div id="statusBar" class="status-bar">
                    <strong>Status:</strong> <span id="statusText">Initializing database...</span>
                </div>
                
                <!-- Predefined Functions -->
                <div class="query-selector">
                    <label for="querySelect">Select SQL Function:</label>
                    <select id="querySelect">
                        <option value="">Choose a function...</option>
                    </select>
                </div>

                <div id="queryInfo" class="query-info" style="display: none;">
                    <h4 id="queryName"></h4>
                    <p id="queryDescription"></p>
                    <span id="complexityBadge" class="complexity-badge"></span>
                </div>

                <button class="button" onclick="executePredefinedQuery()" id="executeBtn" disabled>Execute Function</button>
                <button class="button secondary" onclick="clearResults()">Clear Results</button>

                <!-- Custom SQL -->
                <div class="custom-sql">
                    <label for="customSql">Or Enter Custom SQL:</label>
                    <textarea id="customSql" placeholder="SELECT * FROM products LIMIT 10;"></textarea>
                </div>

                <button class="button" onclick="executeCustomSql()" id="customExecuteBtn" disabled>Execute Custom SQL</button>
            </div>

            <!-- Results Panel -->
            <div class="results-panel">
                <h2>Query Results</h2>
                
                <!-- Results Controls -->
                <div class="results-controls" id="resultsControls" style="display: none;">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search results..." />
                    </div>
                    <div class="pagination-info">
                        <span id="paginationInfo">Showing 0 of 0 results</span>
                        <div class="pagination-controls" id="paginationControls"></div>
                    </div>
                </div>

                <div id="resultsContainer" class="results-container">
                    <div class="loading" id="loading" style="display: none;">
                        <div class="spinner"></div>
                        <p>Executing query...</p>
                    </div>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/middleware.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
