<!-- Tailwind CSS Test Component -->
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-lg shadow-lg overflow-hidden">
    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 p-6">
      <h1 class="text-2xl font-bold text-white">Tailwind CSS Test</h1>
      <p class="text-blue-100 mt-2">This component is styled using Tailwind CSS</p>
    </div>
    
    <div class="p-6">
      <!-- Card content -->
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Responsive Design</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
          <div class="bg-gray-200 p-3 rounded">Column 1</div>
          <div class="bg-gray-200 p-3 rounded">Column 2</div>
          <div class="bg-gray-200 p-3 rounded">Column 3</div>
        </div>
      </div>
      
      <!-- Buttons -->
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Buttons</h2>
        <div class="flex flex-wrap gap-2">
          <button class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Primary
          </button>
          <button class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Success
          </button>
          <button class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Danger
          </button>
        </div>
      </div>
      
      <!-- Form Elements -->
      <div>
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Form</h2>
        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="your@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="Type your message here..."></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<router-outlet />
