<div class="text-input-container">
  <form (ngSubmit)="onSubmit()" class="input-form">
    <div class="input-group">
      <label for="userInput" class="input-label">
        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
        </svg>
        Type your instruction here
      </label>
      
      <div class="textarea-container">
        <textarea
          id="userInput"
          name="userInput"
          [(ngModel)]="userInput"
          (input)="onInputChange()"
          (keypress)="onKeyPress($event)"
          (paste)="onPaste($event)"
          placeholder="Enter your instruction here... (e.g., 'go to home page', 'switch to voice input', 'show help')"
          [maxlength]="maxLength"
          [disabled]="isSubmitting"
          class="input-textarea"
          rows="4"
          aria-describedby="characterCount"
        ></textarea>
        
        <div class="input-actions">
          <button
            type="submit"
            [disabled]="!isValidInput() || isSubmitting"
            class="submit-btn"
            [class.submitting]="isSubmitting"
          >
            <svg *ngIf="!isSubmitting" class="submit-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
            <svg *ngIf="isSubmitting" class="loading-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            {{ isSubmitting ? 'Sending...' : 'Send' }}
          </button>
          
          <button
            type="button"
            (click)="clearInput()"
            [disabled]="!userInput || isSubmitting"
            class="clear-btn"
            aria-label="Clear input"
          >
            <svg class="clear-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="input-footer">
        <div class="character-count" [class]="getCharacterCountClass()">
          <span id="characterCount">
            {{ characterCount }} / {{ maxLength }} characters
          </span>
          <span *ngIf="isNearLimit() && !isAtLimit()" class="warning-text">
            (Approaching limit)
          </span>
          <span *ngIf="isAtLimit()" class="error-text">
            (Character limit reached)
          </span>
        </div>
        
        <div class="input-tips">
          <span class="tip-text">
            💡 Press Enter to send, Shift+Enter for new line
          </span>
        </div>
      </div>
    </div>
  </form>
</div>
