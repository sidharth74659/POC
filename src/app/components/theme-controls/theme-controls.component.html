<div class="theme-controls">
  <h2>Theme Controls</h2>
  
  <app-button 
    (click)="toggleTheme()" 
    variant="primary"
  >
    Toggle theme
  </app-button>
  
  <app-slider 
    label="Btn contrast" 
    [value]="btnContrast()" 
    [min]="1" 
    [max]="10" 
    [step]="1" 
    (valueChange)="updateBtnContrast($event)"
  ></app-slider>
  
  <app-slider 
    label="Hue" 
    [value]="hue()" 
    [min]="0" 
    [max]="359" 
    [step]="1" 
    (valueChange)="updateHue($event)"
  ></app-slider>
  
  <app-slider 
    label="Hue shift" 
    [value]="hueShift()" 
    [min]="0" 
    [max]="180" 
    [step]="1" 
    (valueChange)="updateHueShift($event)"
  ></app-slider>
  
  <app-slider 
    label="Main chroma" 
    [value]="mainChroma()" 
    [min]="0" 
    [max]="1" 
    [step]="0.01" 
    (valueChange)="updateMainChroma($event)"
  ></app-slider>
  
  <app-slider 
    label="Accent chroma" 
    [value]="accentChroma()" 
    [min]="0" 
    [max]="1" 
    [step]="0.01" 
    (valueChange)="updateAccentChroma($event)"
  ></app-slider>
  
  <app-color-token-viewer></app-color-token-viewer>
  
  <div class="actions">
    <app-button 
      (click)="resetTheme()" 
      variant="secondary"
    >
      Reset theme
    </app-button>
  </div>
</div>
